name: Nexus CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
#  job 1 creates backend and install dependencies
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: get-the-code
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install dependencies
        working-directory: ./backEnd
        run: npm install

# job 2 create frontend and build its code
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: install dependencies
        working-directory: ./frontEnd
        run: npm install

#      - name: lint check
#        working-directory: ./frontEnd
#        run: npm run lint

      - name: build frontend
        working-directory: ./frontEnd
        run: npm run build

# Job 3 create image and push to docker hub
  docker:
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    steps:
      - name: get the code
        uses: actions/checkout@v4

      - name: login to docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexus-backend:latest ./backEnd
          docker push ${{ secrets.DOCKER_USERNAME }}/nexus-backend:latest
          
      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/nexus-frontend:latest ./frontEnd
          docker push ${{ secrets.DOCKER_USERNAME }}/nexus-frontend:latest    
